[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-neuron-pipeline"
version = "0.1.0"
description = "Neuron reconstruction pipeline with an open-source VAST Lite Python API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edt>=3.1.1",
    "mascaf",
    "pyvista>=0.48.4",
    "scikit-image>=0.26.0",
    "trimesh>=4.12.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
mascaf = { git = "https://github.com/jmrfox/mascaf.git" }
